name: test

# 한 번에 3~5분. 비공개 저장소의 Actions 는 월 2,000분 무료라 아껴 쓴다.
# - main push 와 PR 에서만 돈다 (dependabot 은 브랜치 push + PR 로 같은 내용을 두 번 돌리던 것을 PR 한 번으로)
# - 문서(.md)만 바뀐 push·PR 은 건너뛴다
# - 같은 브랜치·PR 에 새로 올리면 앞의 실행은 취소한다
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
