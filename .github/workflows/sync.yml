name: sync-schedules

on:
  schedule:
    # 매시 7분 (정각 혼잡 회피). 대회별 실제 갱신 여부는 scripts/sync.ts 가 판단한다:
    # 경기 당일·포스트시즌은 매시간, 평상시는 12시간마다.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "주기와 상관없이 전부 수집"
        type: boolean
        default: false

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # 전체 수집(외부 API 호출 포함)은 3~5분. 외부 API가 느린 날을 대비해 여유를 둔다.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # 평소 10초. npm 저장소가 느린 날 멈춰 있지 않게 5분에 끊는다 (다음 시간 실행이 다시 시도)
      - run: npm ci --no-audit --no-fund
        timeout-minutes: 5
      # 평소 5초. DB 접속 문제로 멈추면 3분 만에 끊어서 다음 실행이 밀리지 않게 한다
      - run: npm run db:setup
        timeout-minutes: 3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npm run sync -- ${{ inputs.force && '--force' || '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      # 경기 알림 메일: 수집이 끝난 뒤(실패한 대회가 있어도) 사이트에 발송을 요청한다.
      # CRON_SECRET 저장소 비밀값이 없으면 건너뛴다 (Vercel 에도 같은 값의 CRON_SECRET 이 있어야 한다).
      - name: send match alert emails
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET 없음: 건너뜀"; exit 0; fi
          curl -fsS --max-time 90 -H "Authorization: Bearer $CRON_SECRET" https://www.my-team-calendar.com/api/cron/notify
