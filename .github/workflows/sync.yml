name: sync-schedules

# 매시간 실행은 Cloudflare Worker(cloudflare/notify-cron.js)가 매시 7분에 요청한다 (workflow_dispatch).
# 아래 GitHub 자체 예약은 Worker 가 멈췄을 때를 위한 예비용으로 6시간마다만 둔다.
# 비공개 저장소의 Actions 는 한 달 2,000분 무료이고 실행마다 1분 단위로 올려 계산하므로,
# 평소 실행을 1분 안에 끝내는 것이 중요하다 (2026-11: 1분 10~30초 → 2분씩 계산돼 한도 초과 직전).
on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "주기와 상관없이 전부 수집"
        type: boolean
        default: false

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # 전체 수집(외부 API 호출 포함)은 3~5분. 외부 API가 느린 날을 대비해 여유를 둔다.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # node_modules 를 통째로 저장해 두고 package-lock.json 이 바뀔 때만 npm ci 를 돈다 (평소 9초 → 2~3초)
      - id: deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
      # npm 저장소가 느린 날 멈춰 있지 않게 5분에 끊는다 (다음 시간 실행이 다시 시도)
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
        timeout-minutes: 5
      # 마이그레이션·시드(db:setup)는 Vercel 배포 빌드가 매번 실행하므로 여기서는 하지 않는다.
      # 경기 알림 메일 호출도 Cloudflare Worker 가 10분마다 하므로 여기서는 하지 않는다.
      - run: npm run sync -- ${{ inputs.force && '--force' || '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
